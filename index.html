<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Leaflet Traffic Plugin Sample</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html, body { margin: 0; height: 100%; }
#map { width: 100%; height: 100vh; }

.traffic-toggle {
    background: #fff;
    padding: 8px 12px;
    border-radius: 6px;
    box-shadow: 0 1px 5px rgba(0,0,0,.4);
    font: 14px/1 system-ui, sans-serif;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
}
.switch { position: relative; width: 38px; height: 20px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
    position: absolute; inset: 0;
    background: #ccc; border-radius: 20px;
    transition: background .2s;
}
.slider::before {
    content: ""; position: absolute;
    width: 16px; height: 16px; left: 2px; top: 2px;
    background: #fff; border-radius: 50%;
    transition: transform .2s;
}
.switch input:checked + .slider { background: #34a853; }
.switch input:checked + .slider::before { transform: translateX(18px); }
</style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="leaflet.traffic.js"></script>
<script>
const map = L.map('map').setView([-6.391176, 106.798182], 15);

// Basemap (OSM)
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// Traffic-only overlay
const traffic = L.tileLayer.traffic({ language: 'id' }).addTo(map);

// On/off switch control
const TrafficToggle = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function () {
        const div = L.DomUtil.create('label', 'traffic-toggle');
        div.innerHTML =
            'Traffic ' +
            '<span class="switch"><input type="checkbox" checked><span class="slider"></span></span>';

        L.DomEvent.disableClickPropagation(div);

        div.querySelector('input').addEventListener('change', function (e) {
            if (e.target.checked) map.addLayer(traffic);
            else map.removeLayer(traffic);
        });
        return div;
    }
});
map.addControl(new TrafficToggle());
</script>
</body>
</html>
